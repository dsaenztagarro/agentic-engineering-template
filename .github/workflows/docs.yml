name: docs

# Every corpus an agent reads is bounded by design (docs/adr/0001). These checks
# are what make the bound true rather than aspirational: a guard that runs on
# every push holds for records nobody has written yet.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: decision records are capped at ten themes
        run: |
          records=$(find docs/adr -maxdepth 1 -name '[0-9][0-9][0-9][0-9]-*.md' | wc -l)
          echo "$records themed records"
          [ "$records" -le 10 ] || { echo "::error::$records records; the cap is ten — amend a theme instead"; exit 1; }

      - name: a record fits in sixty lines
        run: |
          status=0
          for f in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            n=$(wc -l < "$f")
            [ "$n" -le 60 ] || { echo "::error file=$f::$n lines; the ceiling is sixty"; status=1; }
          done
          exit $status

      - name: no folder grows with work items
        run: |
          status=0
          for d in docs/features docs/specs docs/architecture/decisions docs/designs/briefs/shipped; do
            [ ! -e "$d" ] || { echo "::error::$d grows one file per work item; see docs/adr/0001"; status=1; }
          done
          exit $status
